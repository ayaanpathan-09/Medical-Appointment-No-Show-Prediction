version: "3.9"

services:
  api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    volumes:
      - ../models_registry:/app/models_registry
      - ../data:/app/data

  dashboard:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    command: ["streamlit", "run", "src/dashboard/app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports:
      - "8501:8501"
    env_file:
      - ../.env
    volumes:
      - ../models_registry:/app/models_registry
      - ../data:/app/data
    depends_on:
      - api
